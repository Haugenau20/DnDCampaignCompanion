# .github/workflows/firebase-hosting-merge.yml

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
# Two merges in quick succession must not deploy over each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Functions first: a new page must never reach users before the function it
  # calls. Unchanged functions are skipped by the CLI, so most runs are quick.
  # Deploys with its own service account (FIREBASE_FUNCTIONS_DEPLOY_SA), not the
  # Hosting one. Firestore and Storage rules stay manual: firebase.json has no
  # rules keys, so `--only functions` cannot touch them.
  #
  # Fails, and so holds back Hosting, when: prod has a function that the source
  # no longer exports (delete it by hand: `firebase functions:delete`), or the
  # region has no Artifact Registry cleanup policy (set it once with
  # `firebase functions:artifacts:setpolicy --location europe-west1`).
  deploy_functions:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      # firebase.json's predeploy builds the functions, which needs these.
      - name: Install function dependencies
        run: npm ci --prefix firebase/functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SA }}

      - name: Deploy functions
        working-directory: firebase
        run: npx firebase deploy --only functions --project dnd-campaign-companion --non-interactive

  # Merging deploys live, so a red suite must stop the deploy, not just report.
  build_and_deploy:
    needs: [test, deploy_functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build app in Docker container and extract build artifacts
      - name: Build app in container
        run: |
          # Create production env file from GitHub Secrets
          echo "REACT_APP_USE_EMULATORS=false" > .env
          echo "REACT_APP_API_KEY=${{ secrets.REACT_APP_API_KEY }}" >> .env
          echo "REACT_APP_AUTH_DOMAIN=${{ secrets.REACT_APP_AUTH_DOMAIN }}" >> .env
          echo "REACT_APP_PROJECT_ID=${{ secrets.REACT_APP_PROJECT_ID }}" >> .env
          echo "REACT_APP_STORAGE_BUCKET=${{ secrets.REACT_APP_STORAGE_BUCKET }}" >> .env
          echo "REACT_APP_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}" >> .env
          echo "REACT_APP_APP_ID=${{ secrets.REACT_APP_APP_ID }}" >> .env
          echo "REACT_APP_RECAPTCHA_SITE_KEY=${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}" >> .env
          
          # Build using Docker
          docker build -t app-builder -f docker/Dockerfile.frontend.prod .
          docker create --name temp-container app-builder
          docker cp temp-container:/usr/share/nginx/html ./build
          docker rm temp-container
          
          # Copy the build directory to where Firebase expects it relative to the entryPoint
          mkdir -p firebase/build
          cp -r build/* firebase/build/
      
      # Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CAMPAIGN_COMPANION }}
          channelId: live
          projectId: dnd-campaign-companion
          entryPoint: ./firebase