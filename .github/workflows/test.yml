# .github/workflows/test.yml
#
# The checks a merge is supposed to keep green: the type-check (which, unlike
# the build, also covers the test files), lint on the app code with zero
# warnings allowed, lint on the test files against a baseline that may only go
# down, and the jest suite with its 80% coverage floor. Called by
# both hosting workflows, so a PR and the merge-to-main deploy run exactly the
# same gate.
#
# `functions` runs firebase/functions' own suite against the emulators, which
# `firebase emulators:exec` starts and stops around it with the repo's pinned
# CLI (firebase/package.json).
#
# `bundle` runs the production build, which no other job does: it is the only
# resolver that ignores tsconfig `paths`, so an `@/` import passes the type-check
# and jest and fails here. It then holds the entry bundle under its ceiling
# (scripts/check-bundle-size.js, T030). All three jobs must pass for a caller's
# `needs: test`.

name: Test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # App code, zero warnings allowed.
      - name: Lint
        run: npm run lint

      # The test files `npm run lint` skips, held to a per-file baseline that
      # may only go down (scripts/check-test-lint.js).
      - name: Lint test files
        run: npm run lint:tests

      - name: Test
        run: npm run test:ci

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Firestore and Storage-rules emulators are Java.
      - uses: ./.github/actions/toolchain
        with:
          tools: node java

      # The emulator jars are downloaded on first start; they change only with the CLI.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      - name: Install function dependencies
        run: npm ci --prefix firebase/functions

      # What `firebase deploy`'s predeploy runs. The suite type-checks only the
      # files its tests import; this covers the rest.
      - name: Build functions
        run: npm --prefix firebase/functions run build

      - name: Functions suite
        run: npm --prefix firebase run test:functions

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Entry bundle size
        run: npm run check:bundle
