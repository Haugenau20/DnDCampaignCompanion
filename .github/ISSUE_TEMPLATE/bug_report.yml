name: Bug report
description: Something in the app doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include anything private: no email addresses, invite links, or campaign content you wouldn't post publicly.
        **Security problems go to [a private report](https://github.com/Haugenau20/DnDCampaignCompanion/security/advisories/new), never here.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a page anyone can reach, if possible.
      placeholder: |
        1. Open Quests
        2. Tick two quests and choose "Delete"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop or laptop
        - Phone
        - Tablet
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 140, Safari on iOS 19
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Optional. Crop out anything private.
