<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="D&D Campaign Companion - Track your adventures, quests, and NPCs"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>D&D Campaign Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The two families the colour schema names, and only those. Zilla Slab is
         --font-heading (the campaign's voice: titles, entity names, running
         chapter text), Archivo is --font-primary and --font-secondary (the
         application's voice). Italic serif is reserved for in-world voice, so
         Zilla Slab loads one italic weight and Archivo loads none. Both load 700:
         headings compute to bold, and a missing face is synthesised rather than
         drawn -- which the stack this replaced had been doing unnoticed.
         Inter and Newsreader left with 12-1, which stopped authoring font
         values and took them from the schema instead. MedievalSharp went with
         the medieval theme (D102) and Crimson Text and Gentium Book Basic were
         referenced nowhere in src -- the same leftover shape as R47. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Redirect script for client-side routing
      (function() {
        // Check if we need to redirect
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        
        // If we have a stored route
        if (redirect && redirect !== location.href) {
          // Save the route parameter to session storage
          const urlParams = new URLSearchParams(window.location.search);
          const route = urlParams.get('route');
          if (route) {
            // Remove the route parameter and redirect to the actual route
            window.history.replaceState(null, null, '/' + redirect.split('/')[0] + '/' + route);
          }
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
